<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Menu</title>

    <link rel= "stylesheet" href= "HomeStyle.css">
 
</head>
<body>
<header>
    <nav class="navbar">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="where.html">Where</a></li>
            <li><a href="game.html">Game</a></li>
        </ul>
    </nav>
</header>

<main>

    <h1 id="main-heading">Menu</h1>

    <p class= "paragraphStyle">
        Select a size first, then choose a flavor to view its description and price.
    </p>

    <div class= "menu-selection">
        <label for="sizeSelect">Select Size:</label>
        <label for="sizeSelect">Select Size:</label>

<select id="sizeSelect" onchange="enableFlavor()">
    <option value="">Choose a size</option>
    <option value="2">Small - $2.00</option>
    <option value="4">Medium - $4.00</option>
    <option value="6">Large - $6.00</option>
</select>

            <label for="flavorSelect">Select Flavor:</label>
             <select id="flavorSelect" onchange="showSelection()" disabled>

                <option value="">Choose a flavor</option>

                <optgroup label="Ice Cream">
                    <option value="Gratitude"
                            data-description="Lychee ice cream">
                        Gratitude
                    </option>

                    <option value="Good Vibes"
                            data-description="Lavender ice cream">
                        Good Vibes
                    </option>

                    <option value="Red Roses"
                            data-description="Red rose ice cream">
                        Red Roses
                    </option>

                    <option value="Meditate"
                            data-description="Mangosteen ice cream">
                        Meditate
                    </option>

                    <option value="Joy"
                            data-description="Rainbow flavored ice cream">
                        Joy
                    </option>
                </optgroup>

                <optgroup label="Bubble Tea">
                    <option value="Bubble Pink"
                            data-description="Mirabelle flavored bubble tea">
                        Bubble Pink
                    </option>

                    <option value="Euphoria"
                            data-description="Sunshine flavored bubble tea">
                        Euphoria
                    </option>
                </optgroup>

                <optgroup label="Milkshakes">
                    <option value="Sweetheart"
                            data-description="Strawberry milkshake">
                        Sweetheart
                    </option>

                    <option value="Lover"
                            data-description="Raspberry milkshake">
                        Lover
                    </option>

                    <option value="Think Later"
                            data-description="Red velvet milkshake">
                        Think Later
                    </option>
                </optgroup>

                <optgroup label="Frozen Yogurt">
                    <option value="Kindness"
                            data-description="Blackberry frozen yogurt">
                        Kindness
                    </option>
                </optgroup>

            </select>
            <div id="selectionDetails"></div>
    </div>
</main>

<script>
    function enableFlavor() {
            const sizeSelect = document.getElementById("sizeSelect");
            const flavorSelect = document.getElementById("flavorSelect");

            if (sizeSelect.value !== "") {
                flavorSelect.disabled = false;
            } else {
                flavorSelect.disabled = true;
                flavorSelect.value = "";
                document.getElementById("selectionDetails").innerHTML = "";
            }
        }


        function showSelection() {
            const sizeSelect = document.getElementById("sizeSelect");
            const flavorSelect = document.getElementById("flavorSelect");

            const selectedFlavor =
                flavorSelect.options[flavorSelect.selectedIndex];

            if (flavorSelect.value !== "") {

                const flavor = flavorSelect.value;
                const description = selectedFlavor.dataset.description;
                const price = Number(sizeSelect.value).toFixed(2);

                document.getElementById("selectionDetails").innerHTML = `
                    <h2 class="secondheading">${flavor}</h2>
                    <p class="paragraphStyle">${description}</p>
                    <p class="menu-price">$${price}</p>
                `;
            }
        }
</script>

</body>
</main>
